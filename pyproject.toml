[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "pystochastic"
authors = [
  { name = "Bassem Girgis", email = "brgirgis@gmail.com" },
  { name = "Flynn", email = "crf204@gmail.com" },
]
maintainers = [{ name = "Bassem Girgis", email = "brgirgis@gmail.com" }]
description = "Generate realizations of stochastic processes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = ["stochastic", "processes"]
license = { text = "MIT" }
dynamic = ["version"]
classifiers = [
  'Development Status :: 5 - Production/Stable',

  'Operating System :: Microsoft :: Windows',
  'Operating System :: POSIX :: Linux',
  'Operating System :: MacOS',

  'License :: OSI Approved :: MIT License',


  'Intended Audience :: Science/Research',
  'Natural Language :: English',

  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: Implementation :: CPython',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Topic :: Scientific/Engineering :: Physics',
]
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3"]

[project.urls]
Homepage = "https://github.com/pystochastic/pystochastic.git"
Documentation = "https://github.com/pystochastic/pystochastic.git"
Repository = "https://pystochastic.readthedocs.io/en/latest/"
Issues = "https://github.com/pystochastic/pystochastic.git/issues"

[project.scripts]
git-mirror = "pygitmirror.__main__:main"

[dependency-groups]
dev = [
  "black>=26.1.0",
  "build>=1.4.0",
  "codecov>=2.1.13",
  "flake8>=7.3.0",
  "isort>=7.0.0",
  "jinja2>=3.1.6",
  "matplotlib>=3.10.8",
  "mypy>=1.19.1",
  "pylint>=4.0.4",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "scipy-stubs>=1.15.3.0",
  "sphinx>=8.1.3",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-rtd-theme>=3.1.0",
  "twine>=6.2.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.dynamic]
readme = { file = ["README.md"] }

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.flake8]
ignore = ["D", "E1", "E2", "E3", "E5", "W2", "W3", "W5", "E203", "W504", "E712"]
max-line-length = 80
exclude = [
  ".tox",
  ".nox",
  ".local",
  ".git",
  "__pycache__",
  ".nox",
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  ".pytest_cache",
  "scratch",
]

[tool.mypy]

# A
allow_untyped_globals = false
allow_redefinition = false

# D
disallow_any_unimported = true

# N
no_implicit_optional = true

# S
show_error_codes = true
show_error_context = true
show_column_numbers = true

strict = true
strict_optional = true

# W
warn_no_return = true
warn_unreachable = true
